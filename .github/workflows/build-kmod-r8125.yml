name: Build r8125 for iStoreOS 24.10.8 x86_64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout iStoreOS source
        uses: actions/checkout@v4
        with:
          repository: istoreos/istoreos
          ref: istoreos-24.10
          path: istoreos
          fetch-depth: 1

      - name: Checkout r8125 package
        uses: actions/checkout@v4
        with:
          repository: sbwml/package_kernel_r8125
          ref: master
          path: istoreos/package/kernel/r8125

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-pip rsync \
            unzip zlib1g-dev file wget

      - name: Update feeds
        working-directory: ./istoreos
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target x86_64 and kmod-r8125
        working-directory: ./istoreos
        run: |
          # 下载 iStoreOS x86_64_efi 官方的 config.seed，确保内核配置与固件一致
          wget -O .config https://fw0.koolcenter.com/iStoreOS/x86_64_efi/config.seed

          # 强制选中 r8125 驱动，并关闭可能冲突的 r8169
          echo "CONFIG_PACKAGE_kmod-r8125=y" >> .config
          echo "# CONFIG_PACKAGE_kmod-r8169 is not set" >> .config

          make defconfig

      - name: Compile kmod-r8125
        working-directory: ./istoreos
        run: |
          make package/kernel/r8125/compile -j$(nproc) V=s

      - name: Locate and collect ipk
        working-directory: ./istoreos
        run: |
          mkdir -p /tmp/ipk-out
          find bin/ -name "kmod-r8125*.ipk" -exec cp {} /tmp/ipk-out/ \;
          ls -lh /tmp/ipk-out/

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmod-r8125-iStoreOS-24.10.8-x86_64
          path: /tmp/ipk-out/
          if-no-files-found: error
